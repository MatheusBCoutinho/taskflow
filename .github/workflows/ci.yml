name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          DB_FILE: ':memory:'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
